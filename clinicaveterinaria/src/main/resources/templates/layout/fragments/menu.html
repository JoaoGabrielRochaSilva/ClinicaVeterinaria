<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">


<div data-th-fragment="menu" class="space-y-4" th:fragment="menu" id="menu"
      hx-get="/layout/menu-atualizado" hx-trigger="atualizarAuth from:body" hx-target="this">

  <!-- 1o Item Menu -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Usuário', ~{::#usuario-icon})}"></button>

    <!-- Opcoes do 1o Item Menu -->
    <div x-show="open" class="space-y-4 ps-10">
      <!-- 1a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', '/usuarios/nova', ~{::#cadastrar-icon})}">
      </div>
      <!-- 2a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', '/usuarios', ~{::#pesquisar-icon})}">
      </div>
    </div>
  </div>

  <!-- 2o Item Menu -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Animal', ~{::#animal-icon})}"></button>

    <!-- Opcoes do 2o Item Menu -->
    <div x-show="open" class="space-y-4 ps-10">
      <!-- 1a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', '/animais/nova', ~{::#cadastrar-icon})}">
      </div>
      <!-- 2a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', '/animais', ~{::#pesquisar-icon})}">
      </div>
    </div>
  </div>

  <!-- 3o Item Menu -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Prontuário', ~{::#prontuario-icon})}"></button>

    <!-- Opcoes do 3o Item Menu -->
    <div x-show="open" class="space-y-4 ps-10">
      <!-- 1a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', '/prontuarios/nova', ~{::#cadastrar-icon})}">
      </div>
      <!-- 2a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', '/prontuarios', ~{::#pesquisar-icon})}">
      </div>
    </div>
  </div>

  <!-- 4o Item Menu -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Agendamento', ~{::#agendamento-icon})}"></button>

    <!-- Opcoes do 4o Item Menu -->
    <div x-show="open" class="space-y-4 ps-10">
      <!-- 1a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', '/agendamentos/nova', ~{::#cadastrar-icon})}">
      </div>
      <!-- 2a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', '/agendamentos', ~{::#pesquisar-icon})}">
      </div>
    </div>
  </div>

  <!-- 5o Item Menu -->
  <div x-data="{ open: false }">
    <button th:replace="~{components/menu-item-button :: menu-item-button('Consulta', ~{::#consulta-icon})}"></button>

    <!-- Opcoes do 5o Item Menu -->
    <div x-show="open" class="space-y-4 ps-10">
      <!-- 1a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Cadastrar', '/consultas/nova', ~{::#cadastrar-icon})}">
      </div>
      <!-- 2a Opcao -->
      <div
        th:replace="~{components/menu-item-option :: menu-item-option('Pesquisar', '/consultas', ~{::#pesquisar-icon})}">
      </div>
    </div>
  </div>
</div>

<svg id="usuario-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"

</html>
