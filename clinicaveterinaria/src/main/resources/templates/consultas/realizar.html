<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org"
      layout:decorate="~{layout/layoutpadrao}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title>Realizar Atendimento</title>
</head>

<body>
    <main layout:fragment="conteudo"
          th:fragment="conteudo"
          id="main"
          class="flex flex-col align-middle justify-center w-full m-10">

        <h3 class="text-xl font-bold mb-4">Realizar Atendimento</h3>

        <form th:hx-get="@{/consultas/realizar}"
              th:object="${agendamentoSearchRequest}"
              class="w-1/2 mt-6 ms-5">

            <div th:replace="~{components/forms :: inputBuscavel(
                textoLabel='Veterinário',
                nomeAtributo='idVeterinario',
                nomeAtributoTexto='nomeVeterinario',
                nomeAtributoBusca='termoBusca',
                placeholderBusca='Buscar veterinário pelo nome...',
                urlBusca='/usuarios/pesquisar?permissao=VETERINARIO',
                valorAtributo=*{idVeterinario},
                valorAtributoTexto=*{nomeVeterinario},
                isValidado=false)}">
            </div>

            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-4">
                Pesquisar
            </button>
        </form>

        <table class="table-auto border-collapse border border-gray-400 w-full mt-4">
            <thead class="bg-gray-200">
                <tr class="border border-gray-400">
                    <th:block th:replace="~{components/paginacao :: coluna(${pagina}, 'id', 'Código', '')}"></th:block>
                    <th:block th:replace="~{components/paginacao :: coluna(${pagina}, 'dataHora', 'Data e hora', '')}"></th:block>
                    <th>Motivo</th>
                    <th>Animal</th>
                    <th>Veterinário</th>
                    <th>Atender</th>
                </tr>
            </thead>

            <tbody class="border border-gray-400">

                <tr th:each="agendamento : ${pagina.conteudo}"
                    class="border border-gray-400 text-center">

                    <td th:text="${agendamento.id}"></td>
                    <td th:text="${#temporals.format(agendamento.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${agendamento.motivo}"></td>
                    <td th:text="${agendamento.nomeAnimal}"></td>
                    <td th:text="${agendamento.nomeVeterinario}"></td>

                    <td class="px-6 py-4 whitespace-nowrap text-end text-sm font-medium">
                        <a th:hx-get="@{/consultas/realizar/{id}(id=${agendamento.id})}"
                           class="cursor-pointer text-blue-600 hover:text-blue-500 decoration-2 hover:underline focus:outline-hidden focus:underline">
                            Atender
                        </a>
                    </td>
                </tr>

                <tr th:if="${pagina.vazia}">
                    <td colspan="6" class="text-center p-4">
                        Nenhum agendamento pendente encontrado.
                    </td>
                </tr>

            </tbody>
        </table>

        <div th:replace="~{components/paginacao :: paginacao(${pagina})}"></div>

    </main>
</body>

</html>
