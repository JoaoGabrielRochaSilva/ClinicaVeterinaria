<th:block th:fragment="lista" xmlns:th="http://www.thymeleaf.org">

    <li th:if="${#lists.isEmpty(animais)}"
        class="p-2 text-gray-500 italic cursor-default pointer-events-none">
        Nenhum animal encontrado.
    </li>

    <li th:each="animal : ${animais}"
        class="p-2 hover:bg-gray-100 cursor-pointer"
        th:data-value="${animal.id}"
        th:data-text="${animal.nome + ' — ' + animal.nomeDono}"
        th:text="${animal.nome + ' — ' + animal.nomeDono}">
    </li>

</th:block>
